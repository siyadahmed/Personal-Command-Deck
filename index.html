<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Spectral:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Chart Room — aged nautical chart. Deliberately a single light
     theme: paper ground, chart-ink navy, engraved-label typography. */
  :root{
    --bg:#ecdfba;        /* chart paper */
    --panel:#e4d5a9;     /* columns recede into the sheet */
    --panel-2:#f2e8c8;   /* cards + fields lift off it */
    --line:#c3b284;      /* pencil rule */
    --track:#d6c496;     /* engraved groove behind meters */
    --text:#1c3a52;      /* prussian chart ink */
    --muted:#3f5a67;     /* faded ink — notes, labels */
    --muted-2:#5f5e4d;   /* pencil grey — tertiary marks */
    --youtube:#a8402f;   /* madder red */
    --consulting:#2f5d7a;/* chart indigo */
    --skill:#6d4b7c;     /* murex plum */
    --hobby:#3f7a5f;     /* verdigris */
    --invest:#96702a;    /* brass */
    --other:#6f7f83;     /* slate */
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Spectral',Georgia,serif;
    min-height:100vh;
  }
  .wrap{max-width:1400px;margin:0 auto;padding:28px 24px 60px;}

  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;font-weight:700;margin:0;letter-spacing:.005em;line-height:1.1;}
  .sub{color:var(--muted);font-size:13px;margin:0;}
  .status-pill{font-family:'DM Mono',ui-monospace,monospace;font-size:11px;color:var(--muted-2);}

  .meter{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .meter-title{font-family:'DM Mono',ui-monospace,monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
  .meter-bar{display:flex;height:10px;width:100%;border-radius:6px;overflow:hidden;background:var(--track);}
  .meter-seg{height:100%;cursor:pointer;transition:opacity .15s;min-width:2px;}
  .meter-seg:hover{opacity:.75;}
  .meter-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;}
  .legend-item.off{opacity:.35;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}

  .toolbar{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .quickadd{flex:1 1 480px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;}
  .quickadd input[type=text]{flex:1 1 240px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px 12px;font-size:14px;font-family:'Spectral',Georgia,serif;}
  .quickadd input[type=text]::placeholder{color:var(--muted-2);opacity:.85;}
  .quickadd input[type=text]:focus{outline:2px solid var(--consulting);outline-offset:1px;border-color:var(--consulting);}
  select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:9px 10px;font-size:13px;font-family:'Spectral',Georgia,serif;}
  select:focus{outline:2px solid var(--consulting);outline-offset:1px;}
  .btn{background:var(--text);color:var(--bg);border:none;border-radius:7px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Spectral',Georgia,serif;white-space:nowrap;}
  .btn:focus-visible,.card-actions button:focus-visible,.card-progress:focus-visible,.card-notes:focus-visible{outline:2px solid var(--consulting);outline-offset:2px;}
  .btn:hover{opacity:.88;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .iobar{display:flex;gap:8px;}
  #importFile{display:none;}

  .board{margin-top:20px;display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;overflow-x:auto;}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:200px;display:flex;flex-direction:column;}
  .col.dragover{border-color:var(--muted-2);background:var(--panel-2);}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;}
  .col-head-title{font-family:'DM Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
  .col-count{font-family:'DM Mono',ui-monospace,monospace;font-size:11px;color:var(--muted-2);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 7px;}
  .cards{display:flex;flex-direction:column;gap:8px;flex:1;min-height:60px;}
  /* A parent and its sub-tasks read as one block: tight 5px inside the
     group, the column's 8px between groups, and a hairline rail down
     the indent so the nesting is visible without reading any labels. */
  .group{display:flex;flex-direction:column;gap:5px;}
  .subtree{display:flex;flex-direction:column;gap:5px;margin-left:9px;padding-left:11px;border-left:1px solid var(--line);}
  .empty{color:var(--muted-2);font-size:12px;text-align:center;padding:20px 6px;border:1px dashed var(--line);border-radius:8px;}

  .card{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--other);border-radius:8px;padding:10px 10px 8px;cursor:grab;}
  .card:active{cursor:grabbing;}
  .card.dragging{opacity:.4;}
  .card-parent{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;color:var(--muted-2);margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-title{font-size:14px;font-weight:600;line-height:1.32;margin:0 0 6px;text-wrap:pretty;}
  .card-notes{font-size:12px;color:var(--muted);line-height:1.4;margin:0 0 8px;white-space:pre-wrap;cursor:pointer;border-radius:6px;padding:2px 4px;margin-left:-4px;margin-right:-4px;}
  .card-notes:hover{background:var(--panel);}
  .card-notes.empty{color:var(--muted-2);font-style:italic;border:1px dashed var(--line);text-align:center;padding:4px 6px;margin-left:0;margin-right:0;}
  .card-notes.empty:hover{color:var(--muted);border-color:var(--muted-2);background:none;}
  .card-progress{display:flex;align-items:flex-start;gap:6px;width:100%;margin:0 -4px 8px;padding:3px 4px;background:none;border:none;border-radius:5px;cursor:pointer;text-align:left;font:inherit;}
  .card-progress:hover{background:var(--panel);}
  .card-progress:hover .card-progress-label,.card-progress:hover .card-progress-chevron{color:var(--text);}
  .card-progress-chevron{color:var(--muted-2);font-size:11px;line-height:1.45;flex:none;}
  .card-progress-body{flex:1;min-width:0;}
  .card-progress-bar{display:block;height:4px;border-radius:3px;background:var(--track);overflow:hidden;}
  .card-progress-fill{display:block;height:100%;background:var(--muted);border-radius:3px;}
  .card-progress-label{display:block;margin-top:4px;font-family:'DM Mono',ui-monospace,monospace;font-size:10px;color:var(--muted-2);}
  .card-foot{display:flex;align-items:center;justify-content:space-between;}
  .card-area{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .card-actions{display:flex;gap:8px;}
  .card-actions button{background:none;border:none;color:var(--muted-2);cursor:pointer;font-size:12px;padding:0;}
  .card-actions button:hover{color:var(--text);}

  /* Paper label, not an inverted chip — keeps the ink-on-cream world. */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--text);color:var(--text);padding:7px 16px;border-radius:6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .2s;font-family:'DM Mono',ui-monospace,monospace;box-shadow:0 4px 14px rgba(28,58,82,.16);}
  .toast.show{opacity:1;}

  /* ---- Dialogs (replacing native prompt/confirm/alert) ---- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(28,58,82,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;}
  .modal{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 14px 40px rgba(28,58,82,.28);width:100%;max-width:430px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;}
  .modal-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:25px;font-weight:700;line-height:1.15;margin:0;text-wrap:balance;}
  .modal-message{font-size:13.5px;line-height:1.5;color:var(--muted);margin:0;overflow-wrap:anywhere;}
  .modal-fields{display:flex;flex-direction:column;gap:12px;}
  .modal-field label{display:block;font-family:'DM Mono',ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;}
  .modal-field input,.modal-field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px 11px;font-size:14px;line-height:1.45;font-family:'Spectral',Georgia,serif;}
  .modal-field textarea{min-height:94px;resize:vertical;}
  .modal-field input::placeholder,.modal-field textarea::placeholder{color:var(--muted-2);opacity:.8;}
  .modal-field input:focus,.modal-field textarea:focus{outline:2px solid var(--consulting);outline-offset:1px;border-color:var(--consulting);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  .btn-danger{background:var(--youtube);color:var(--bg);}

  /* In column direction the toolbar's flex-basis would apply to height,
     stretching the quick-add box to 480px tall — pin it back to content. */
  @media (max-width:900px){
    .board{grid-template-columns:1fr;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .quickadd{flex:0 0 auto;}
  }

  .gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .gate-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:28px 26px;width:100%;max-width:330px;text-align:center;}
  .gate-box h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:700;margin:0 0 6px;}
  .gate-box p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 16px;}
  .gate-box input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:10px 12px;font-size:14px;font-family:'Spectral',Georgia,serif;}
  .gate-box input::placeholder{color:var(--muted-2);opacity:.8;}
  .gate-box input:focus{outline:2px solid var(--consulting);outline-offset:1px;border-color:var(--consulting);}
  .gate-box .btn{width:100%;margin-top:10px;}
  .gate-box .btn[disabled]{opacity:.6;cursor:default;}
  .gate-error{color:var(--youtube);font-size:12px;margin-top:10px;min-height:14px;line-height:1.4;}
  .gate-sent{font-size:26px;color:var(--hobby);margin-bottom:4px;}
  .gate.shake .gate-box{animation:shake .3s;}

  .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .header-right select{padding:5px 8px;font-size:12px;}
  .btn-sm{padding:5px 10px;font-size:12px;}
  @keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-sent hidden" id="gateSent">✓</div>
    <h2 id="gateTitle">Pinboard</h2>
    <p id="gateCopy">Sign in with your email and we'll send you a link.</p>
    <form id="gateForm">
      <input type="email" id="gateInput" autocomplete="email" placeholder="you@example.com" required>
      <button class="btn" id="gateBtn" type="submit">Email me a link</button>
    </form>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<div class="wrap hidden" id="app">
  <header>
    <div>
      <h1>Pinboard</h1>
      <p class="sub">Every plan, one board. Synced live across your devices.</p>
    </div>
    <div class="header-right">
      <select id="boardSelect" class="hidden" aria-label="Choose board"></select>
      <div class="status-pill" id="statusPill">connecting…</div>
      <button class="btn btn-ghost btn-sm" id="signOutBtn" type="button">Sign out</button>
    </div>
  </header>

  <div class="meter">
    <div class="meter-title">Focus meter — where your open items actually sit</div>
    <div class="meter-bar" id="meterBar"></div>
    <div class="meter-legend" id="meterLegend"></div>
  </div>

  <div class="toolbar">
    <div class="quickadd">
      <input type="text" id="newTitle" placeholder="Add a task or plan… e.g. Script next YouTube video" maxlength="140">
      <select id="newArea"></select>
      <button class="btn" id="addBtn">Add</button>
    </div>
    <div class="iobar">
      <button class="btn btn-ghost" id="exportBtn">Export JSON</button>
      <button class="btn btn-ghost" id="importBtn">Import JSON</button>
      <input type="file" id="importFile" accept="application/json">
    </div>
  </div>

  <div class="board" id="board"></div>
</div>
<div class="toast" id="toast"></div>

<div class="modal-backdrop hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h2 class="modal-title" id="modalTitle"></h2>
    <p class="modal-message" id="modalMessage"></p>
    <div class="modal-fields" id="modalFields"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="modalCancel">Cancel</button>
      <button type="button" class="btn" id="modalConfirm">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ---- Config ---------------------------------------------------------
  const SUPABASE_URL = 'https://iurmlkqlasufztgtrzpf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cm1sa3FsYXN1Znp0Z3RyenBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTM2MTAsImV4cCI6MjEwMjUyOTYxMH0.BGDtHiW9FnxnhiuyHe9rFQNqNbFAIxWx3YWP4coDjI8';
  // The anon key is public by design — it identifies the project, it does
  // not grant access. Access is decided by Postgres: RLS only returns rows
  // on boards you are a member of, and you become a member by signing in
  // through a magic link sent to your email.
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---- Board data -------------------------------------------------------
  const AREA_DEFS = {
    youtube:    {label:'YouTube',    color:'var(--youtube)'},
    consulting: {label:'Consulting', color:'var(--consulting)'},
    skill:      {label:'Skill Dev',  color:'var(--skill)'},
    hobby:      {label:'Hobby / Pi', color:'var(--hobby)'},
    invest:     {label:'Investing',  color:'var(--invest)'},
    other:      {label:'Other',      color:'var(--other)'}
  };
  const STATUSES = [
    {id:'backlog',  label:'Backlog'},
    {id:'todo',     label:'To Do'},
    {id:'progress', label:'In Progress'},
    {id:'blocked',  label:'Blocked'},
    {id:'done',     label:'Done'}
  ];

  const COLLAPSE_KEY = 'pinboard-collapsed';
  const BOARD_KEY = 'pinboard-board';

  let state = { tasks: [] };
  let activeAreaFilter = null;
  let dragId = null;
  let currentUser = null;
  let boards = [];
  let currentBoardId = null;
  let collapsedParents = new Set();
  try{
    // Carry collapse state across the rename, rather than every parent
    // silently springing open the first time the renamed build loads.
    const legacyCollapse = localStorage.getItem('command-deck-collapsed');
    if(legacyCollapse !== null && localStorage.getItem(COLLAPSE_KEY) === null){
      localStorage.setItem(COLLAPSE_KEY, legacyCollapse);
    }
    localStorage.removeItem('command-deck-collapsed');
    localStorage.removeItem('command-deck-board');
    collapsedParents = new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '[]'));
  } catch(e){}

  const $board = document.getElementById('board');
  const $meterBar = document.getElementById('meterBar');
  const $meterLegend = document.getElementById('meterLegend');
  const $newTitle = document.getElementById('newTitle');
  const $newArea = document.getElementById('newArea');
  const $statusPill = document.getElementById('statusPill');
  const $toast = document.getElementById('toast');

  function showToast(msg){
    $toast.textContent = msg;
    $toast.classList.add('show');
    setTimeout(()=>$toast.classList.remove('show'), 1600);
  }

  function uid(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  // ---- Dialogs -------------------------------------------------------
  // In-page replacements for prompt/confirm/alert, so every popup is
  // themed. openModal resolves to a {field: value} map, or null on cancel.
  const $modal = document.getElementById('modal');
  const $modalTitle = document.getElementById('modalTitle');
  const $modalMessage = document.getElementById('modalMessage');
  const $modalFields = document.getElementById('modalFields');
  const $modalCancel = document.getElementById('modalCancel');
  const $modalConfirm = document.getElementById('modalConfirm');
  let modalResolve = null;
  let modalReturnFocus = null;

  function closeModal(result){
    if(!modalResolve) return;
    const resolve = modalResolve;
    modalResolve = null;
    $modal.classList.add('hidden');
    document.removeEventListener('keydown', modalKeydown, true);
    if(modalReturnFocus && document.contains(modalReturnFocus)) modalReturnFocus.focus();
    modalReturnFocus = null;
    resolve(result);
  }

  function submitModal(){
    const values = {};
    $modalFields.querySelectorAll('[data-field]').forEach(el => { values[el.dataset.field] = el.value; });
    closeModal(values);
  }

  function modalKeydown(e){
    if(e.key === 'Escape'){ e.preventDefault(); closeModal(null); }
    else if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); submitModal(); }
  }

  function openModal({title, message='', fields=[], confirmLabel='Save', cancelLabel='Cancel', danger=false}){
    modalReturnFocus = document.activeElement;
    $modalTitle.textContent = title;
    $modalMessage.textContent = message;
    $modalMessage.classList.toggle('hidden', !message);
    $modalFields.innerHTML = '';
    $modalFields.classList.toggle('hidden', fields.length === 0);
    fields.forEach(f => {
      const wrap = document.createElement('div');
      wrap.className = 'modal-field';
      const control = document.createElement(f.multiline ? 'textarea' : 'input');
      if(!f.multiline) control.type = 'text';
      control.id = 'modalField_' + f.name;
      control.dataset.field = f.name;
      control.value = f.value || '';
      if(f.placeholder) control.placeholder = f.placeholder;
      if(f.maxLength) control.maxLength = f.maxLength;
      const label = document.createElement('label');
      label.setAttribute('for', control.id);
      label.textContent = f.label;
      wrap.appendChild(label);
      wrap.appendChild(control);
      $modalFields.appendChild(wrap);
    });
    $modalConfirm.textContent = confirmLabel;
    $modalConfirm.classList.toggle('btn-danger', danger);
    $modalCancel.textContent = cancelLabel || '';
    $modalCancel.classList.toggle('hidden', !cancelLabel);
    $modal.classList.remove('hidden');
    document.addEventListener('keydown', modalKeydown, true);

    const first = $modalFields.querySelector('[data-field]');
    if(first){
      first.focus();
      const end = first.value.length;
      try{ first.setSelectionRange(end, end); } catch(e){}
    } else {
      $modalConfirm.focus();
    }
    return new Promise(resolve => { modalResolve = resolve; });
  }

  async function confirmDialog(opts){
    return (await openModal({ ...opts, fields: [] })) !== null;
  }

  function alertDialog(title, message){
    return openModal({ title, message, confirmLabel: 'OK', cancelLabel: null });
  }

  $modalConfirm.addEventListener('click', submitModal);
  $modalCancel.addEventListener('click', ()=> closeModal(null));
  $modal.addEventListener('mousedown', e => { if(e.target === $modal) closeModal(null); });

  function mapRow(row){
    return {
      id: row.id,
      title: row.title,
      area: row.area,
      status: row.status,
      notes: row.notes || '',
      parentId: row.parent_id || null,
      boardId: row.board_id || null,
      createdAt: row.created_at,
      updatedAt: row.updated_at
    };
  }

  function children(taskId){
    return state.tasks.filter(t=>t.parentId===taskId);
  }

  function toggleCollapse(taskId){
    if(collapsedParents.has(taskId)) collapsedParents.delete(taskId);
    else collapsedParents.add(taskId);
    localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedParents]));
    render();
  }

  // ---- Remote load + writes ---------------------------------------------
  async function load(){
    if(!currentBoardId){
      state.tasks = [];
      $statusPill.textContent = 'no board';
      render();
      return;
    }
    $statusPill.textContent = 'connecting…';
    const { data, error } = await sb.from('tasks').select('*').eq('board_id', currentBoardId);
    if(error){
      $statusPill.textContent = 'sync failed';
      showToast('Could not load board: ' + error.message);
      return;
    }
    state.tasks = data.map(mapRow);
    $statusPill.textContent = 'synced';
    render();
    subscribeRealtime();
  }

  async function insertTask(task){
    const { error } = await sb.from('tasks').insert({
      id: task.id, title: task.title, area: task.area,
      status: task.status, notes: task.notes, parent_id: task.parentId || null,
      board_id: currentBoardId, created_by: currentUser ? currentUser.id : null
    });
    if(error){
      state.tasks = state.tasks.filter(t=>t.id!==task.id);
      render();
      showToast('Could not save: ' + error.message);
    }
  }

  async function patchTask(id, patch){
    const { error } = await sb.from('tasks').update(patch).eq('id', id);
    if(error) showToast('Could not save change: ' + error.message);
  }

  async function removeTask(id){
    const { error } = await sb.from('tasks').delete().eq('id', id);
    if(error) showToast('Could not delete: ' + error.message);
  }

  function applyLocalPatch(task, patch){
    Object.assign(task, patch);
    task.updatedAt = new Date().toISOString();
    render();
    patchTask(task.id, { ...patch, updated_at: task.updatedAt });
  }

  // ---- Realtime -----------------------------------------------------
  function upsertLocal(row){
    const mapped = mapRow(row);
    const idx = state.tasks.findIndex(t=>t.id===mapped.id);
    if(idx>=0) state.tasks[idx] = mapped; else state.tasks.push(mapped);
    render();
  }
  function removeLocal(id){
    state.tasks = state.tasks.filter(t=>t.id!==id);
    render();
  }

  let taskChannel = null;

  function subscribeRealtime(){
    if(taskChannel){ sb.removeChannel(taskChannel); taskChannel = null; }
    const boardAtSubscribe = currentBoardId;

    // Deliberately unfiltered server-side. A postgres_changes filter on
    // board_id would silently drop DELETEs: Postgres only ships the primary
    // key in the old record unless the table is REPLICA IDENTITY FULL, so
    // the filter never matches and deleted cards linger. RLS already limits
    // events to boards you belong to; narrowing to the open board is a
    // cheap client-side check.
    taskChannel = sb.channel('tasks-' + boardAtSubscribe)
      .on('postgres_changes', { event:'*', schema:'public', table:'tasks' }, payload => {
        if(payload.eventType === 'DELETE'){
          removeLocal(payload.old.id);
        } else if(payload.new && payload.new.board_id === currentBoardId){
          upsertLocal(payload.new);
        }
      })
      .subscribe(status => {
        if(status === 'SUBSCRIBED') $statusPill.textContent = 'synced · live';
        else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') $statusPill.textContent = 'live sync unavailable';
      });
  }

  // Areas you can see on the open board. Owners see all of them; a member
  // sees what the owner granted. The database already hides the rest — this
  // keeps the picker and meter from offering areas that would be refused.
  function visibleAreaIds(){
    const m = memberships.get(currentBoardId);
    const all = Object.keys(AREA_DEFS);
    return (m && Array.isArray(m.visible_areas)) ? all.filter(a => m.visible_areas.includes(a)) : all;
  }

  function populateAreaSelect(){
    const areas = visibleAreaIds();
    $newArea.innerHTML = areas.map(id => `<option value="${id}">${AREA_DEFS[id].label}</option>`).join('');
    const canAdd = areas.length > 0;
    $newTitle.disabled = !canAdd;
    $newArea.disabled = !canAdd;
    document.getElementById('addBtn').disabled = !canAdd;
    $newTitle.placeholder = canAdd
      ? 'Add a task or plan… e.g. Script next YouTube video'
      : "You haven't been given access to any areas on this board";
  }

  function areaCounts(){
    const counts = {};
    visibleAreaIds().forEach(a => counts[a]=0);
    state.tasks.forEach(t => { if(t.status!=='done') counts[t.area] = (counts[t.area]||0)+1; });
    return counts;
  }

  function renderMeter(){
    const counts = areaCounts();
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    $meterBar.innerHTML = '';
    if(total === 0){
      $meterBar.innerHTML = `<div class="meter-seg" style="width:100%;background:var(--panel-2);"></div>`;
    } else {
      Object.entries(counts).forEach(([area,count])=>{
        if(count===0) return;
        const pct = (count/total*100).toFixed(2);
        const seg = document.createElement('div');
        seg.className = 'meter-seg';
        seg.style.width = pct+'%';
        const def = AREA_DEFS[area] || AREA_DEFS.other;
        seg.style.background = def.color;
        seg.title = `${def.label}: ${count} open`;
        seg.addEventListener('click', ()=>{
          activeAreaFilter = activeAreaFilter === area ? null : area;
          render();
        });
        $meterBar.appendChild(seg);
      });
    }
    $meterLegend.innerHTML = '';
    visibleAreaIds().map(id => [id, AREA_DEFS[id]]).forEach(([id,def])=>{
      const item = document.createElement('div');
      item.className = 'legend-item' + (activeAreaFilter && activeAreaFilter!==id ? ' off':'');
      item.innerHTML = `<span class="dot" style="background:${def.color}"></span>${def.label} · ${counts[id]||0}`;
      item.addEventListener('click', ()=>{
        activeAreaFilter = activeAreaFilter === id ? null : id;
        render();
      });
      $meterLegend.appendChild(item);
    });
  }

  function renderBoard(){
    $board.innerHTML = '';
    STATUSES.forEach(st=>{
      const col = document.createElement('div');
      col.className = 'col';
      col.dataset.status = st.id;

      const visible = state.tasks.filter(t => t.status===st.id
        && (!activeAreaFilter || t.area===activeAreaFilter)
        && !(t.parentId && collapsedParents.has(t.parentId)));

      col.innerHTML = `<div class="col-head">
          <div class="col-head-title">${st.label}</div>
          <div class="col-count">${visible.length}</div>
        </div>
        <div class="cards" data-status="${st.id}"></div>`;

      const cardsWrap = col.querySelector('.cards');
      if(visible.length===0){
        cardsWrap.innerHTML = `<div class="empty">Nothing here</div>`;
      } else {
        // Sorting purely by recency scattered sub-tasks away from their
        // parent — usually above it, since children are created later.
        // Group each parent with its own sub-tasks instead. Sub-tasks whose
        // parent sits in a different column have nothing to nest under, so
        // they collect at the bottom and keep their breadcrumb.
        const byRecent = (a,b)=> b.updatedAt.localeCompare(a.updatedAt);
        const idsHere = new Set(visible.map(t=>t.id));
        const kidsOf = new Map();
        visible.forEach(t=>{
          if(t.parentId && idsHere.has(t.parentId)){
            if(!kidsOf.has(t.parentId)) kidsOf.set(t.parentId, []);
            kidsOf.get(t.parentId).push(t);
          }
        });

        visible.filter(t=>!t.parentId).sort(byRecent).forEach(top=>{
          const group = document.createElement('div');
          group.className = 'group';
          group.appendChild(renderCard(top));
          const kids = (kidsOf.get(top.id) || []).sort(byRecent);
          if(kids.length){
            const subtree = document.createElement('div');
            subtree.className = 'subtree';
            kids.forEach(k => subtree.appendChild(renderCard(k, {nested:true})));
            group.appendChild(subtree);
          }
          cardsWrap.appendChild(group);
        });

        visible.filter(t => t.parentId && !idsHere.has(t.parentId))
          .sort(byRecent)
          .forEach(t => cardsWrap.appendChild(renderCard(t)));
      }

      col.addEventListener('dragover', e=>{
        e.preventDefault();
        col.classList.add('dragover');
      });
      col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
      col.addEventListener('drop', async e=>{
        e.preventDefault();
        col.classList.remove('dragover');
        if(!dragId) return;
        const task = state.tasks.find(t=>t.id===dragId);
        if(!task || task.status === st.id) return;
        const patch = { status: st.id };
        if(st.id === 'blocked' && !task.notes){
          const result = await openModal({
            title: "What's blocking this?",
            message: task.title,
            fields: [{name:'notes', label:'Blocked because', value:'', multiline:true,
                      placeholder:'Waiting on…'}],
            confirmLabel: 'Save & move',
            cancelLabel: 'Move without a note'
          });
          if(result && result.notes.trim()) patch.notes = result.notes.trim();
        }
        applyLocalPatch(task, patch);
      });

      $board.appendChild(col);
    });
  }

  function renderCard(t, opts){
    const nested = !!(opts && opts.nested);
    const isSubtask = !!t.parentId;
    const parent = isSubtask ? state.tasks.find(p=>p.id===t.parentId) : null;
    const kids = isSubtask ? [] : children(t.id);
    const doneKids = kids.filter(k=>k.status==='done').length;
    const collapsed = collapsedParents.has(t.id);
    // Nested cards sit under their parent behind the rail, so the
    // breadcrumb would just repeat what the indent already says.
    const showBreadcrumb = isSubtask && !nested;

    const card = document.createElement('div');
    card.className = 'card' + (nested ? ' card-nested' : '');
    card.style.borderLeftColor = AREA_DEFS[t.area] ? AREA_DEFS[t.area].color : 'var(--other)';
    card.draggable = true;
    card.innerHTML = `
      ${showBreadcrumb ? `<p class="card-parent">↳ ${parent ? escapeHtml(parent.title) : 'parent task'}</p>` : ''}
      <p class="card-title"></p>
      <p class="card-notes${t.notes ? '' : ' empty'}" data-act="note" title="${t.notes ? 'Edit note' : 'Add a note'}"></p>
      ${kids.length ? `
        <button class="card-progress" data-act="collapse" title="${collapsed ? 'Expand' : 'Collapse'} sub-tasks">
          <span class="card-progress-chevron">${collapsed ? '▸' : '▾'}</span>
          <span class="card-progress-body">
            <span class="card-progress-bar"><span class="card-progress-fill" style="width:${(doneKids/kids.length*100).toFixed(0)}%"></span></span>
            <span class="card-progress-label">Sub-tasks ${doneKids}/${kids.length}${collapsed ? ' · hidden' : ''}</span>
          </span>
        </button>` : ''}
      <div class="card-foot">
        <span class="card-area">${AREA_DEFS[t.area] ? AREA_DEFS[t.area].label : 'Other'}</span>
        <div class="card-actions">
          ${!isSubtask ? `<button data-act="addsub" title="Add sub-task">＋</button>` : ''}
          <button data-act="edit" title="Edit">✎</button>
          <button data-act="del" title="Delete">✕</button>
        </div>
      </div>`;
    card.querySelector('.card-title').textContent = t.title;
    card.querySelector('.card-notes').textContent = t.notes || '+ Add note';

    card.addEventListener('dragstart', ()=>{
      dragId = t.id;
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));

    const addSubBtn = card.querySelector('[data-act="addsub"]');
    if(addSubBtn) addSubBtn.addEventListener('click', ()=> addSubtask(t));

    const collapseBtn = card.querySelector('[data-act="collapse"]');
    if(collapseBtn) collapseBtn.addEventListener('click', ()=> toggleCollapse(t.id));

    card.querySelector('[data-act="note"]').addEventListener('click', ()=> editNote(t));

    card.querySelector('[data-act="del"]').addEventListener('click', async ()=>{
      const kidCount = children(t.id).length;
      const ok = await confirmDialog({
        title: 'Delete this task?',
        message: kidCount>0
          ? `"${t.title}" and its ${kidCount} sub-task${kidCount>1?'s':''} will be removed from the board.`
          : `"${t.title}" will be removed from the board.`,
        confirmLabel: 'Delete',
        danger: true
      });
      if(!ok) return;
      const idsToRemove = new Set([t.id, ...children(t.id).map(k=>k.id)]);
      state.tasks = state.tasks.filter(x=>!idsToRemove.has(x.id));
      if(collapsedParents.delete(t.id)) localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedParents]));
      render();
      removeTask(t.id);
      showToast('Deleted');
    });
    card.querySelector('[data-act="edit"]').addEventListener('click', async ()=>{
      const result = await openModal({
        title: 'Edit task',
        fields: [
          {name:'title', label:'Title', value:t.title, maxLength:140},
          {name:'notes', label:'Notes', value:t.notes, multiline:true,
           placeholder:'Context, blockers, links — anything worth recalling later'}
        ]
      });
      if(!result) return;
      applyLocalPatch(t, {
        title: result.title.trim() || t.title,
        notes: result.notes
      });
    });

    return card;
  }

  async function editNote(t){
    const result = await openModal({
      title: t.notes ? 'Edit note' : 'Add a note',
      message: t.title,
      fields: [{name:'notes', label:'Note', value:t.notes, multiline:true,
                placeholder:'Why is this parked? What would unblock it?'}]
    });
    if(!result) return;
    applyLocalPatch(t, { notes: result.notes });
  }

  async function addSubtask(parentTask){
    const result = await openModal({
      title: 'Add sub-task',
      message: `Under "${parentTask.title}"`,
      fields: [{name:'title', label:'Sub-task title', value:'', maxLength:140,
                placeholder:'e.g. Draft the outline'}],
      confirmLabel: 'Add'
    });
    if(!result || !result.title.trim()) return;
    const title = result.title;
    const now = new Date().toISOString();
    const task = {
      id: uid(), title: title.trim(), area: parentTask.area, status: 'backlog',
      notes: '', parentId: parentTask.id, createdAt: now, updatedAt: now
    };
    state.tasks.push(task);
    if(collapsedParents.has(parentTask.id)){
      collapsedParents.delete(parentTask.id);
      localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedParents]));
    }
    render();
    insertTask(task);
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    renderMeter();
    renderBoard();
  }

  document.getElementById('addBtn').addEventListener('click', addTask);
  $newTitle.addEventListener('keydown', e=>{ if(e.key==='Enter') addTask(); });

  function addTask(){
    const title = $newTitle.value.trim();
    if(!title) return;
    const area = $newArea.value;
    const now = new Date().toISOString();
    const task = {id:uid(), title, area, status:'backlog', notes:'', createdAt:now, updatedAt:now};
    state.tasks.push(task);
    $newTitle.value = '';
    render();
    insertTask(task);
  }

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pinboard-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Exported');
  });

  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.tasks || !Array.isArray(parsed.tasks)) throw new Error('bad format');
        if(!currentBoardId) throw new Error('no board open');
        $statusPill.textContent = 'importing…';
        // Scoped to the open board — import replaces this board, never the
        // other boards you're a member of.
        const { error: delErr } = await sb.from('tasks').delete().eq('board_id', currentBoardId);
        if(delErr) throw delErr;
        const rows = parsed.tasks.map(t => ({
          id: t.id || uid(), title: t.title, area: t.area,
          status: t.status, notes: t.notes || '', parent_id: t.parentId || null,
          board_id: currentBoardId, created_by: currentUser ? currentUser.id : null
        })).sort((a,b) => (a.parent_id ? 1 : 0) - (b.parent_id ? 1 : 0));
        if(rows.length){
          const { error: insErr } = await sb.from('tasks').insert(rows);
          if(insErr) throw insErr;
        }
        await load();
        showToast('Imported');
      } catch(err){
        $statusPill.textContent = 'synced';
        alertDialog('Import failed', 'Could not read that file: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---- Sign in (magic link) -------------------------------------------
  const $gate = document.getElementById('gate');
  const $app = document.getElementById('app');
  const $gateForm = document.getElementById('gateForm');
  const $gateInput = document.getElementById('gateInput');
  const $gateBtn = document.getElementById('gateBtn');
  const $gateError = document.getElementById('gateError');
  const $gateTitle = document.getElementById('gateTitle');
  const $gateCopy = document.getElementById('gateCopy');
  const $gateSent = document.getElementById('gateSent');
  const $boardSelect = document.getElementById('boardSelect');
  const $signOutBtn = document.getElementById('signOutBtn');

  function gateError(msg){
    $gateError.textContent = msg;
    $gate.classList.add('shake');
    setTimeout(()=>$gate.classList.remove('shake'), 300);
  }

  $gateForm.addEventListener('submit', async e => {
    e.preventDefault();
    const email = $gateInput.value.trim();
    if(!email) return;
    $gateError.textContent = '';
    $gateBtn.disabled = true;
    $gateBtn.textContent = 'Sending…';

    // Must exactly match an entry in Supabase → Authentication →
    // URL Configuration → Redirect URLs, or the link lands on the site root.
    const redirectTo = window.location.origin + window.location.pathname;
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo } });

    $gateBtn.disabled = false;
    $gateBtn.textContent = 'Email me a link';
    if(error){ gateError(error.message); return; }

    $gateSent.classList.remove('hidden');
    $gateTitle.textContent = 'Check your inbox';
    $gateCopy.innerHTML = 'We sent a link to <strong></strong>. Opening it signs you in — it expires in an hour.';
    $gateCopy.querySelector('strong').textContent = email;
    $gateForm.classList.add('hidden');
  });

  // ---- Boards ----------------------------------------------------------
  let memberships = new Map();   // board id -> { role, visible_areas }

  async function loadBoards(){
    const [{ data, error }, { data: mine, error: memberErr }] = await Promise.all([
      sb.from('boards').select('*').order('created_at'),
      sb.from('board_members').select('board_id, role, visible_areas').eq('user_id', currentUser.id)
    ]);
    if(error || memberErr){
      showToast('Could not load your boards: ' + (error || memberErr).message);
      return;
    }
    memberships = new Map((mine || []).map(m => [m.board_id, m]));
    boards = data || [];
    const saved = localStorage.getItem(BOARD_KEY);
    currentBoardId = boards.some(b => b.id === saved) ? saved
                   : (boards[0] ? boards[0].id : null);
    if(currentBoardId) localStorage.setItem(BOARD_KEY, currentBoardId);

    $boardSelect.innerHTML = boards.map(b =>
      `<option value="${b.id}"></option>`).join('');
    [...$boardSelect.options].forEach((opt, i) => {
      const shared = memberships.get(boards[i].id)?.role === 'member';
      opt.textContent = boards[i].name + (shared ? ' (shared with you)' : '');
    });
    $boardSelect.value = currentBoardId || '';
    // A switcher with one option is just clutter — it appears when there's
    // somewhere to switch to.
    $boardSelect.classList.toggle('hidden', boards.length < 2);
  }

  $boardSelect.addEventListener('change', async ()=>{
    currentBoardId = $boardSelect.value;
    localStorage.setItem(BOARD_KEY, currentBoardId);
    activeAreaFilter = null;
    populateAreaSelect();
    await load();
  });

  $signOutBtn.addEventListener('click', async ()=>{
    if(taskChannel){ sb.removeChannel(taskChannel); taskChannel = null; }
    await sb.auth.signOut();
    localStorage.removeItem(BOARD_KEY);
    window.location.reload();
  });

  // ---- Session ---------------------------------------------------------
  let appStarted = false;

  async function enterApp(session){
    if(appStarted) return;
    appStarted = true;
    currentUser = session.user;
    $gate.classList.add('hidden');
    $app.classList.remove('hidden');
    // Strip the magic-link tokens out of the address bar once consumed.
    history.replaceState({}, document.title, window.location.pathname + window.location.search);
    // Accept any boards shared with this email since the account was made.
    // Harmless no-op if there are none.
    const { error: claimErr } = await sb.rpc('claim_board_invites');
    if(claimErr) console.warn('Could not check for shared boards:', claimErr.message);
    await loadBoards();
    populateAreaSelect();
    if(!currentBoardId){
      $statusPill.textContent = 'no board';
      showToast('Your account has no board yet — reload in a moment.');
      return;
    }
    await load();
  }

  // Fires on first load with a restored session, and again when the magic
  // link is opened; enterApp guards against running twice.
  sb.auth.onAuthStateChange((event, session) => {
    if(session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) enterApp(session);
    if(event === 'SIGNED_OUT') window.location.reload();
  });

  (async function boot(){
    const { data:{ session } } = await sb.auth.getSession();
    if(session) enterApp(session);
    else $gateInput.focus();
  })();
})();
</script>
</body>
</html>
