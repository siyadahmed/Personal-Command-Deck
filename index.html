<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#11141b;
    --panel:#181c26;
    --panel-2:#1f2430;
    --line:#2a3040;
    --text:#e9ebf1;
    --muted:#8a91a6;
    --muted-2:#5c6376;
    --youtube:#ef5b5b;
    --consulting:#4f9de0;
    --skill:#9b7fe0;
    --hobby:#4fb787;
    --invest:#d9ac4f;
    --other:#8a91a6;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1400px;margin:0 auto;padding:28px 24px 60px;}

  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin:0;letter-spacing:-0.01em;}
  .sub{color:var(--muted);font-size:13px;margin:0;}
  .status-pill{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted-2);}

  .meter{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .meter-title{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
  .meter-bar{display:flex;height:10px;width:100%;border-radius:6px;overflow:hidden;background:var(--panel-2);}
  .meter-seg{height:100%;cursor:pointer;transition:opacity .15s;min-width:2px;}
  .meter-seg:hover{opacity:.75;}
  .meter-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;}
  .legend-item.off{opacity:.35;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}

  .toolbar{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .quickadd{flex:1 1 480px;display:flex;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;}
  .quickadd input[type=text]{flex:1 1 240px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px 12px;font-size:14px;font-family:'Inter',sans-serif;}
  .quickadd input[type=text]:focus{outline:none;border-color:var(--muted-2);}
  select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:9px 10px;font-size:13px;font-family:'Inter',sans-serif;}
  .btn{background:var(--text);color:var(--bg);border:none;border-radius:7px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;}
  .btn:hover{opacity:.88;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .iobar{display:flex;gap:8px;}
  #importFile{display:none;}

  .board{margin-top:20px;display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;overflow-x:auto;}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:200px;display:flex;flex-direction:column;}
  .col.dragover{border-color:var(--muted-2);background:var(--panel-2);}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;}
  .col-head-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;letter-spacing:.02em;}
  .col-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted-2);background:var(--panel-2);border-radius:10px;padding:1px 7px;}
  .cards{display:flex;flex-direction:column;gap:8px;flex:1;min-height:60px;}
  .empty{color:var(--muted-2);font-size:12px;text-align:center;padding:20px 6px;border:1px dashed var(--line);border-radius:8px;}

  .card{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--other);border-radius:8px;padding:10px 10px 8px;cursor:grab;}
  .card:active{cursor:grabbing;}
  .card.dragging{opacity:.4;}
  .card-parent{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted-2);margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-title{font-size:13.5px;font-weight:500;line-height:1.35;margin:0 0 6px;}
  .card-notes{font-size:12px;color:var(--muted);line-height:1.4;margin:0 0 8px;white-space:pre-wrap;cursor:pointer;border-radius:6px;padding:2px 4px;margin-left:-4px;margin-right:-4px;}
  .card-notes:hover{background:var(--panel);}
  .card-notes.empty{color:var(--muted-2);font-style:italic;border:1px dashed var(--line);text-align:center;padding:4px 6px;margin-left:0;margin-right:0;}
  .card-notes.empty:hover{color:var(--muted);border-color:var(--muted-2);background:none;}
  .card-progress{display:flex;align-items:flex-start;gap:6px;width:100%;margin:0 0 8px;background:none;border:none;padding:0;cursor:pointer;text-align:left;font:inherit;}
  .card-progress:hover .card-progress-label{color:var(--text);}
  .card-progress-chevron{color:var(--muted-2);font-size:10px;line-height:1.6;flex:none;}
  .card-progress-body{flex:1;min-width:0;}
  .card-progress-bar{display:block;height:4px;border-radius:3px;background:var(--line);overflow:hidden;}
  .card-progress-fill{display:block;height:100%;background:var(--muted);border-radius:3px;}
  .card-progress-label{display:block;margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted-2);}
  .card-foot{display:flex;align-items:center;justify-content:space-between;}
  .card-area{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .card-actions{display:flex;gap:8px;}
  .card-actions button{background:none;border:none;color:var(--muted-2);cursor:pointer;font-size:12px;padding:0;}
  .card-actions button:hover{color:var(--text);}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 16px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;font-family:'JetBrains Mono',monospace;}
  .toast.show{opacity:1;}

  @media (max-width:900px){ .board{grid-template-columns:1fr;} .toolbar{flex-direction:column;align-items:stretch;} }

  .gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;}
  .gate-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:28px 26px;width:100%;max-width:280px;text-align:center;}
  .gate-box h2{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:0 0 4px;}
  .gate-box p{color:var(--muted);font-size:12px;margin:0 0 16px;}
  .gate-box input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:10px 12px;font-size:14px;font-family:'Inter',sans-serif;text-align:center;letter-spacing:.1em;}
  .gate-box input:focus{outline:none;border-color:var(--muted-2);}
  .gate-box .btn{width:100%;margin-top:10px;}
  .gate-error{color:var(--youtube);font-size:12px;margin-top:10px;min-height:14px;}
  .gate.shake .gate-box{animation:shake .3s;}
  @keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h2>Command Deck</h2>
    <p>Enter passcode to continue</p>
    <input type="password" id="gateInput" autocomplete="off" maxlength="40">
    <button class="btn" id="gateBtn">Unlock</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<div class="wrap hidden" id="app">
  <header>
    <div>
      <h1>Command Deck</h1>
      <p class="sub">Every plan, one board. Synced live across your devices.</p>
    </div>
    <div class="status-pill" id="statusPill">connecting…</div>
  </header>

  <div class="meter">
    <div class="meter-title">Focus meter — where your open items actually sit</div>
    <div class="meter-bar" id="meterBar"></div>
    <div class="meter-legend" id="meterLegend"></div>
  </div>

  <div class="toolbar">
    <div class="quickadd">
      <input type="text" id="newTitle" placeholder="Add a task or plan… e.g. Script next YouTube video" maxlength="140">
      <select id="newArea"></select>
      <button class="btn" id="addBtn">Add</button>
    </div>
    <div class="iobar">
      <button class="btn btn-ghost" id="exportBtn">Export JSON</button>
      <button class="btn btn-ghost" id="importBtn">Import JSON</button>
      <input type="file" id="importFile" accept="application/json">
    </div>
  </div>

  <div class="board" id="board"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  // ---- Config ---------------------------------------------------------
  const SUPABASE_URL = 'https://iurmlkqlasufztgtrzpf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cm1sa3FsYXN1Znp0Z3RyenBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTM2MTAsImV4cCI6MjEwMjUyOTYxMH0.BGDtHiW9FnxnhiuyHe9rFQNqNbFAIxWx3YWP4coDjI8';
  // Cosmetic gate only — not real security. The anon key above is public
  // (visible in page source) and the database enforces access via RLS, not
  // this passcode. Change it before deploying, and don't put sensitive data
  // in this board.
  const PASSCODE = 'Dan33n2018';
  const GATE_KEY = 'command-deck-gate-ok';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---- Board data -------------------------------------------------------
  const AREA_DEFS = {
    youtube:    {label:'YouTube',    color:'var(--youtube)'},
    consulting: {label:'Consulting', color:'var(--consulting)'},
    skill:      {label:'Skill Dev',  color:'var(--skill)'},
    hobby:      {label:'Hobby / Pi', color:'var(--hobby)'},
    invest:     {label:'Investing',  color:'var(--invest)'},
    other:      {label:'Other',      color:'var(--other)'}
  };
  const STATUSES = [
    {id:'backlog',  label:'Backlog'},
    {id:'todo',     label:'To Do'},
    {id:'progress', label:'In Progress'},
    {id:'blocked',  label:'Blocked'},
    {id:'done',     label:'Done'}
  ];

  const COLLAPSE_KEY = 'command-deck-collapsed';

  let state = { tasks: [] };
  let activeAreaFilter = null;
  let dragId = null;
  let collapsedParents = new Set();
  try{ collapsedParents = new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '[]')); } catch(e){}

  const $board = document.getElementById('board');
  const $meterBar = document.getElementById('meterBar');
  const $meterLegend = document.getElementById('meterLegend');
  const $newTitle = document.getElementById('newTitle');
  const $newArea = document.getElementById('newArea');
  const $statusPill = document.getElementById('statusPill');
  const $toast = document.getElementById('toast');

  function showToast(msg){
    $toast.textContent = msg;
    $toast.classList.add('show');
    setTimeout(()=>$toast.classList.remove('show'), 1600);
  }

  function uid(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function mapRow(row){
    return {
      id: row.id,
      title: row.title,
      area: row.area,
      status: row.status,
      notes: row.notes || '',
      parentId: row.parent_id || null,
      createdAt: row.created_at,
      updatedAt: row.updated_at
    };
  }

  function children(taskId){
    return state.tasks.filter(t=>t.parentId===taskId);
  }

  function toggleCollapse(taskId){
    if(collapsedParents.has(taskId)) collapsedParents.delete(taskId);
    else collapsedParents.add(taskId);
    localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedParents]));
    render();
  }

  // ---- Remote load + writes ---------------------------------------------
  async function load(){
    $statusPill.textContent = 'connecting…';
    const { data, error } = await sb.from('tasks').select('*');
    if(error){
      $statusPill.textContent = 'sync failed';
      showToast('Could not load board: ' + error.message);
      return;
    }
    state.tasks = data.map(mapRow);
    $statusPill.textContent = 'synced';
    populateAreaSelect();
    render();
    subscribeRealtime();
  }

  async function insertTask(task){
    const { error } = await sb.from('tasks').insert({
      id: task.id, title: task.title, area: task.area,
      status: task.status, notes: task.notes, parent_id: task.parentId || null
    });
    if(error){
      state.tasks = state.tasks.filter(t=>t.id!==task.id);
      render();
      showToast('Could not save: ' + error.message);
    }
  }

  async function patchTask(id, patch){
    const { error } = await sb.from('tasks').update(patch).eq('id', id);
    if(error) showToast('Could not save change: ' + error.message);
  }

  async function removeTask(id){
    const { error } = await sb.from('tasks').delete().eq('id', id);
    if(error) showToast('Could not delete: ' + error.message);
  }

  function applyLocalPatch(task, patch){
    Object.assign(task, patch);
    task.updatedAt = new Date().toISOString();
    render();
    patchTask(task.id, { ...patch, updated_at: task.updatedAt });
  }

  // ---- Realtime -----------------------------------------------------
  function upsertLocal(row){
    const mapped = mapRow(row);
    const idx = state.tasks.findIndex(t=>t.id===mapped.id);
    if(idx>=0) state.tasks[idx] = mapped; else state.tasks.push(mapped);
    render();
  }
  function removeLocal(id){
    state.tasks = state.tasks.filter(t=>t.id!==id);
    render();
  }

  function subscribeRealtime(){
    sb.channel('tasks-sync')
      .on('postgres_changes', { event:'*', schema:'public', table:'tasks' }, payload => {
        if(payload.eventType === 'INSERT' || payload.eventType === 'UPDATE'){
          upsertLocal(payload.new);
        } else if(payload.eventType === 'DELETE'){
          removeLocal(payload.old.id);
        }
      })
      .subscribe(status => {
        if(status === 'SUBSCRIBED') $statusPill.textContent = 'synced · live';
        else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') $statusPill.textContent = 'live sync unavailable';
      });
  }

  function populateAreaSelect(){
    $newArea.innerHTML = Object.entries(AREA_DEFS).map(([id,def]) =>
      `<option value="${id}">${def.label}</option>`).join('');
  }

  function areaCounts(){
    const counts = {};
    Object.keys(AREA_DEFS).forEach(a => counts[a]=0);
    state.tasks.forEach(t => { if(t.status!=='done') counts[t.area] = (counts[t.area]||0)+1; });
    return counts;
  }

  function renderMeter(){
    const counts = areaCounts();
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    $meterBar.innerHTML = '';
    if(total === 0){
      $meterBar.innerHTML = `<div class="meter-seg" style="width:100%;background:var(--panel-2);"></div>`;
    } else {
      Object.entries(counts).forEach(([area,count])=>{
        if(count===0) return;
        const pct = (count/total*100).toFixed(2);
        const seg = document.createElement('div');
        seg.className = 'meter-seg';
        seg.style.width = pct+'%';
        seg.style.background = AREA_DEFS[area].color;
        seg.title = `${AREA_DEFS[area].label}: ${count} open`;
        seg.addEventListener('click', ()=>{
          activeAreaFilter = activeAreaFilter === area ? null : area;
          render();
        });
        $meterBar.appendChild(seg);
      });
    }
    $meterLegend.innerHTML = '';
    Object.entries(AREA_DEFS).forEach(([id,def])=>{
      const item = document.createElement('div');
      item.className = 'legend-item' + (activeAreaFilter && activeAreaFilter!==id ? ' off':'');
      item.innerHTML = `<span class="dot" style="background:${def.color}"></span>${def.label} · ${counts[id]||0}`;
      item.addEventListener('click', ()=>{
        activeAreaFilter = activeAreaFilter === id ? null : id;
        render();
      });
      $meterLegend.appendChild(item);
    });
  }

  function renderBoard(){
    $board.innerHTML = '';
    STATUSES.forEach(st=>{
      const col = document.createElement('div');
      col.className = 'col';
      col.dataset.status = st.id;

      const tasks = state.tasks.filter(t => t.status===st.id
        && (!activeAreaFilter || t.area===activeAreaFilter)
        && !(t.parentId && collapsedParents.has(t.parentId)));

      col.innerHTML = `<div class="col-head">
          <div class="col-head-title">${st.label}</div>
          <div class="col-count">${tasks.length}</div>
        </div>
        <div class="cards" data-status="${st.id}"></div>`;

      const cardsWrap = col.querySelector('.cards');
      if(tasks.length===0){
        cardsWrap.innerHTML = `<div class="empty">Nothing here</div>`;
      } else {
        tasks.sort((a,b)=> b.updatedAt.localeCompare(a.updatedAt)).forEach(t=>{
          cardsWrap.appendChild(renderCard(t));
        });
      }

      col.addEventListener('dragover', e=>{
        e.preventDefault();
        col.classList.add('dragover');
      });
      col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
      col.addEventListener('drop', e=>{
        e.preventDefault();
        col.classList.remove('dragover');
        if(!dragId) return;
        const task = state.tasks.find(t=>t.id===dragId);
        if(task && task.status !== st.id){
          const patch = { status: st.id };
          if(st.id === 'blocked' && !task.notes){
            const reason = prompt(`Why is "${task.title}" blocked?`);
            if(reason && reason.trim()) patch.notes = reason.trim();
          }
          applyLocalPatch(task, patch);
        }
      });

      $board.appendChild(col);
    });
  }

  function renderCard(t){
    const isSubtask = !!t.parentId;
    const parent = isSubtask ? state.tasks.find(p=>p.id===t.parentId) : null;
    const kids = isSubtask ? [] : children(t.id);
    const doneKids = kids.filter(k=>k.status==='done').length;
    const collapsed = collapsedParents.has(t.id);

    const card = document.createElement('div');
    card.className = 'card';
    card.style.borderLeftColor = AREA_DEFS[t.area] ? AREA_DEFS[t.area].color : 'var(--other)';
    card.draggable = true;
    card.innerHTML = `
      ${isSubtask ? `<p class="card-parent">↳ ${parent ? escapeHtml(parent.title) : 'parent task'}</p>` : ''}
      <p class="card-title"></p>
      <p class="card-notes${t.notes ? '' : ' empty'}" data-act="note" title="${t.notes ? 'Edit note' : 'Add a note'}"></p>
      ${kids.length ? `
        <button class="card-progress" data-act="collapse" title="${collapsed ? 'Expand' : 'Collapse'} sub-tasks">
          <span class="card-progress-chevron">${collapsed ? '▸' : '▾'}</span>
          <span class="card-progress-body">
            <span class="card-progress-bar"><span class="card-progress-fill" style="width:${(doneKids/kids.length*100).toFixed(0)}%"></span></span>
            <span class="card-progress-label">Sub-tasks ${doneKids}/${kids.length}${collapsed ? ' · hidden' : ''}</span>
          </span>
        </button>` : ''}
      <div class="card-foot">
        <span class="card-area">${AREA_DEFS[t.area] ? AREA_DEFS[t.area].label : 'Other'}</span>
        <div class="card-actions">
          ${!isSubtask ? `<button data-act="addsub" title="Add sub-task">＋</button>` : ''}
          <button data-act="edit" title="Edit">✎</button>
          <button data-act="del" title="Delete">✕</button>
        </div>
      </div>`;
    card.querySelector('.card-title').textContent = t.title;
    card.querySelector('.card-notes').textContent = t.notes || '+ Add note';

    card.addEventListener('dragstart', ()=>{
      dragId = t.id;
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));

    const addSubBtn = card.querySelector('[data-act="addsub"]');
    if(addSubBtn) addSubBtn.addEventListener('click', ()=> addSubtask(t));

    const collapseBtn = card.querySelector('[data-act="collapse"]');
    if(collapseBtn) collapseBtn.addEventListener('click', ()=> toggleCollapse(t.id));

    card.querySelector('[data-act="note"]').addEventListener('click', ()=> editNote(t));

    card.querySelector('[data-act="del"]').addEventListener('click', ()=>{
      const kidCount = children(t.id).length;
      const msg = kidCount>0
        ? `Delete "${t.title}" and its ${kidCount} sub-task${kidCount>1?'s':''}?`
        : `Delete "${t.title}"?`;
      if(confirm(msg)){
        const idsToRemove = new Set([t.id, ...children(t.id).map(k=>k.id)]);
        state.tasks = state.tasks.filter(x=>!idsToRemove.has(x.id));
        if(collapsedParents.delete(t.id)) localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedParents]));
        render();
        removeTask(t.id);
        showToast('Deleted');
      }
    });
    card.querySelector('[data-act="edit"]').addEventListener('click', ()=>{
      const newTitle = prompt('Edit title:', t.title);
      if(newTitle===null) return;
      const newNotes = prompt('Edit notes (optional):', t.notes||'');
      applyLocalPatch(t, {
        title: newTitle.trim() || t.title,
        notes: newNotes===null ? t.notes : newNotes
      });
    });

    return card;
  }

  function editNote(t){
    const newNotes = prompt('Note:', t.notes || '');
    if(newNotes===null) return;
    applyLocalPatch(t, { notes: newNotes });
  }

  function addSubtask(parentTask){
    const title = prompt(`Sub-task of "${parentTask.title}":`);
    if(title===null || !title.trim()) return;
    const now = new Date().toISOString();
    const task = {
      id: uid(), title: title.trim(), area: parentTask.area, status: 'backlog',
      notes: '', parentId: parentTask.id, createdAt: now, updatedAt: now
    };
    state.tasks.push(task);
    if(collapsedParents.has(parentTask.id)){
      collapsedParents.delete(parentTask.id);
      localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedParents]));
    }
    render();
    insertTask(task);
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    renderMeter();
    renderBoard();
  }

  document.getElementById('addBtn').addEventListener('click', addTask);
  $newTitle.addEventListener('keydown', e=>{ if(e.key==='Enter') addTask(); });

  function addTask(){
    const title = $newTitle.value.trim();
    if(!title) return;
    const area = $newArea.value;
    const now = new Date().toISOString();
    const task = {id:uid(), title, area, status:'backlog', notes:'', createdAt:now, updatedAt:now};
    state.tasks.push(task);
    $newTitle.value = '';
    render();
    insertTask(task);
  }

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'command-deck-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Exported');
  });

  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.tasks || !Array.isArray(parsed.tasks)) throw new Error('bad format');
        $statusPill.textContent = 'importing…';
        const { error: delErr } = await sb.from('tasks').delete().neq('id', '');
        if(delErr) throw delErr;
        const rows = parsed.tasks.map(t => ({
          id: t.id || uid(), title: t.title, area: t.area,
          status: t.status, notes: t.notes || '', parent_id: t.parentId || null
        })).sort((a,b) => (a.parent_id ? 1 : 0) - (b.parent_id ? 1 : 0));
        if(rows.length){
          const { error: insErr } = await sb.from('tasks').insert(rows);
          if(insErr) throw insErr;
        }
        await load();
        showToast('Imported');
      } catch(err){
        $statusPill.textContent = 'synced';
        alert('Could not import that file: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---- Passcode gate ------------------------------------------------
  const $gate = document.getElementById('gate');
  const $app = document.getElementById('app');
  const $gateInput = document.getElementById('gateInput');
  const $gateBtn = document.getElementById('gateBtn');
  const $gateError = document.getElementById('gateError');

  function unlock(){
    $gate.classList.add('hidden');
    $app.classList.remove('hidden');
    load();
  }

  function tryPasscode(){
    if($gateInput.value === PASSCODE){
      sessionStorage.setItem(GATE_KEY, '1');
      unlock();
    } else {
      $gateError.textContent = 'Incorrect passcode';
      $gate.classList.add('shake');
      setTimeout(()=>$gate.classList.remove('shake'), 300);
      $gateInput.value = '';
      $gateInput.focus();
    }
  }

  $gateBtn.addEventListener('click', tryPasscode);
  $gateInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryPasscode(); });

  if(sessionStorage.getItem(GATE_KEY) === '1'){
    unlock();
  } else {
    $gateInput.focus();
  }
})();
</script>
</body>
</html>
